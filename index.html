<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#16161d" />
    <meta name="description" content="スマホのブラウザで動くファミコン（NES）エミュレータ" />
    <!-- iOS でホーム画面に追加したとき、全画面のアプリとして開く -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NES Emu" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <title>NES Emu</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <button class="btn" id="menu-open">≡ メニュー</button>
      <button class="btn" id="ff" aria-pressed="false" aria-label="早送り">⏩</button>
      <button class="btn" id="sound" aria-label="音のオン・オフ">🔊</button>
      <button class="btn" id="rotate" aria-label="横画面に切り替え">横画面</button>
      <span id="fps"></span>
    </header>
    <div id="screen-wrap">
      <canvas id="screen" width="240" height="224"></canvas>
      <p id="message">「メニュー」からゲームを選んでください</p>
    </div>
    <div id="menu" hidden>
      <div class="menu-panel" role="dialog" aria-label="メニュー">
        <div class="menu-head">
          <span>メニュー</span>
          <button class="btn" id="menu-close">閉じる</button>
        </div>
        <section>
          <h2>どこでもセーブ</h2>
          <p class="hint" id="slots-hint"></p>
          <div id="slots"></div>
        </section>
        <section>
          <div class="menu-row">
            <h2>ゲーム一覧</h2>
            <label class="btn accent">
              ＋ ROM を追加
              <input type="file" id="rom" hidden />
            </label>
          </div>
          <p class="hint" id="library-hint"></p>
          <ul id="library"></ul>
        </section>
        <section>
          <button class="btn" id="reset" disabled>リセット</button>
        </section>
      </div>
    </div>
    <div id="toast" role="status" hidden>
      <span id="toast-text"></span>
      <button class="btn" id="toast-action" hidden></button>
    </div>
    <section id="pad">
      <div id="dpad">
        <div class="arm" data-btn="UP"></div>
        <div class="arm" data-btn="LEFT"></div>
        <div class="hub"></div>
        <div class="arm" data-btn="RIGHT"></div>
        <div class="arm" data-btn="DOWN"></div>
      </div>
      <div id="ab">
        <div class="round" data-btn="B">B</div>
        <div class="round" data-btn="A">A</div>
      </div>
      <div id="sys">
        <div class="pill" data-btn="SELECT"><span></span>SELECT</div>
        <div class="pill" data-btn="START"><span></span>START</div>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
