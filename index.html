<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#16161d" />
    <title>NES Emu</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <label class="btn">
        ROM を開く
        <input type="file" id="rom" accept=".nes" hidden />
      </label>
      <button class="btn" id="reset" disabled>リセット</button>
      <span id="fps"></span>
    </header>
    <div id="screen-wrap">
      <canvas id="screen" width="256" height="240"></canvas>
      <p id="message">ROM ファイル（.nes）を選んでください</p>
    </div>
    <section id="pad">
      <p class="note">コントローラーは次の段階で追加します</p>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
