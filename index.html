<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#16161d" />
    <title>NES Emu</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <label class="btn">
        ROM を開く
        <input type="file" id="rom" accept=".nes" hidden />
      </label>
      <button class="btn" id="reset" disabled>リセット</button>
      <button class="btn" id="sound" aria-label="音のオン・オフ">🔊</button>
      <span id="fps"></span>
    </header>
    <div id="screen-wrap">
      <canvas id="screen" width="256" height="240"></canvas>
      <p id="message">ROM ファイル（.nes）を選んでください</p>
    </div>
    <section id="pad">
      <div id="dpad">
        <div class="arm" data-btn="UP"></div>
        <div class="arm" data-btn="LEFT"></div>
        <div class="hub"></div>
        <div class="arm" data-btn="RIGHT"></div>
        <div class="arm" data-btn="DOWN"></div>
      </div>
      <div id="ab">
        <div class="round" data-btn="B">B</div>
        <div class="round" data-btn="A">A</div>
      </div>
      <div id="sys">
        <div class="pill" data-btn="SELECT"><span></span>SELECT</div>
        <div class="pill" data-btn="START"><span></span>START</div>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
